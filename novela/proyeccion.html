<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyección · Novela Colectiva</title>
  <link rel="stylesheet" href="css/estilos.css">
  <meta name="theme-color" content="#6d28d9">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📽️</text></svg>">
</head>
<body class="modo-proyeccion">

<div id="cargando" class="aviso-caja">Abriendo la novela…</div>

<div id="sin-sesion" class="aviso-caja alerta oculto">
  Entra primero en el <a href="docente.html">panel docente</a> y abre la proyección desde ahí.
</div>

<main id="escenario" class="oculto">
  <header class="proy-cabecera">
    <h1 id="proy-titulo"></h1>
    <div class="proy-datos">
      <span id="proy-contadores"></span>
      <button class="btn btn-mini btn-secundario" id="btn-voz">🔊 Leer en voz alta</button>
      <button class="btn btn-mini btn-secundario" id="btn-tamano" title="Tamaño de la letra">A+</button>
    </div>
  </header>

  <div class="proy-texto" id="proy-texto"></div>

  <footer class="proy-pie">
    <span id="proy-ultima"></span>
  </footer>
</main>

<script src="../js/firebase-config.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="js/proyeccion.js"></script>
</body>
</html>
