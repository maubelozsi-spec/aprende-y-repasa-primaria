<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chispa y la Fábrica de Robots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1230; --bg2:#101b47; --panel:#15235c; --panel2:#1b2c70; --line:rgba(130,170,255,.14);
  --text:#eef3ff; --muted:#a6b5de; --c1:#22d39a; --c2:#ff9f36; --c3:#a67cff; --accent:#22d39a;
  --danger:#ff5d73; --gold:#ffd23f; --cell:#1a2a66; --cell2:#20337a; --wall:#3a4a86; --shadow:0 10px 30px rgba(0,0,0,.35);
  --mv:#4c8dff; --ctl:#ffab19; --sen:#2fb8d6;
}
:root[data-theme="light"]{
  --bg:#eaf1ff; --bg2:#dbe6ff; --panel:#ffffff; --panel2:#f1f5ff; --line:rgba(40,70,160,.12);
  --text:#14204a; --muted:#51608f; --cell:#e6edff; --cell2:#d6e1ff; --wall:#8a97c2; --shadow:0 8px 24px rgba(20,40,110,.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Baloo 2",ui-rounded,"Segoe UI Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 10%, color-mix(in srgb,var(--accent) 22%, transparent), transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(120,90,255,.18), transparent 45%),
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:auto,auto,40px 40px,40px 40px;
  overflow-x:hidden; -webkit-user-select:none; user-select:none;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
#app{min-height:100vh;display:flex;flex-direction:column}
.pdi{font-size:20px}
.ind{font-size:17px}

/* ---------- common ---------- */
.btn{border:0;border-radius:18px;padding:.55em 1.1em;font-size:1em;font-weight:700;background:var(--panel2);
  box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s, filter .15s;display:inline-flex;align-items:center;gap:.4em;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--accent);color:#08112e}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{width:2.6em;height:2.6em;border-radius:50%;padding:0;font-size:1.05em}
.topbar{display:flex;align-items:center;gap:.6em;padding:.6em 1em;background:color-mix(in srgb,var(--bg) 70%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:1.25em;margin:0;flex:1;line-height:1.1;min-width:0}
.topbar h1 small{display:block;font-size:.62em;color:var(--muted);font-weight:500}
.card{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.muted{color:var(--muted)}
.hidden{display:none!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glow{50%{opacity:.35}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.robot-eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.robot-bulb{animation:glow 1.4s infinite}
.floaty{animation:float 3s ease-in-out infinite}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;padding:2em 1em;gap:1.4em}
.logo{text-align:center}
.logo h1{font-size:clamp(2em,5vw,3.4em);margin:.1em 0 0;line-height:1;letter-spacing:.5px}
.logo h1 span{color:var(--c1)} .logo h1 b{color:var(--c2)} .logo h1 i{font-style:normal;color:var(--c3)}
.logo p{margin:.3em 0 0;color:var(--muted);font-size:1.1em}
.ciclos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.2em;width:min(1100px,100%)}
.ciclo-card{padding:1.2em;text-align:center;cursor:pointer;position:relative;overflow:hidden;border:3px solid transparent;transition:transform .15s,border-color .15s}
.ciclo-card:hover{transform:translateY(-4px);border-color:var(--cc)}
.ciclo-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--cc) 35%,transparent),transparent 65%)}
.ciclo-card>*{position:relative}
.ciclo-card h2{margin:.2em 0 0;font-size:1.6em;color:var(--cc)}
.ciclo-card .zone{font-weight:700}
.ciclo-card .tag{display:inline-block;margin-top:.5em;padding:.15em .8em;border-radius:99px;background:color-mix(in srgb,var(--cc) 20%,transparent);font-size:.85em}
.ciclo-card .bar{height:10px;border-radius:9px;background:var(--panel2);margin-top:.8em;overflow:hidden}
.ciclo-card .bar i{display:block;height:100%;background:var(--cc);border-radius:9px}
.home-actions{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center}

/* ---------- map ---------- */
.map-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1em;padding:1em;max-width:1300px;width:100%;margin:0 auto}
@media (max-width:860px){.map-wrap{grid-template-columns:1fr}}
.map{position:relative;padding:1em;height:clamp(460px,78vh,760px);align-self:start}
.side{align-self:start}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:0;
  background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.5em;
  box-shadow:0 6px 0 rgba(0,0,0,.3), 0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}
.node.done{background:var(--accent);color:#08112e}
.node.current{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 rgba(0,0,0,.3),0 0 0 14px color-mix(in srgb,var(--accent) 20%,transparent)}}
.node.locked{opacity:.45;cursor:not-allowed}
.node .stars{font-size:.5em;letter-spacing:-1px;line-height:1}
.node .lbl{position:absolute;top:100%;margin-top:10px;font-size:.55em;white-space:nowrap;background:var(--panel);padding:.05em .6em;border-radius:9px;color:var(--text);font-weight:700}
.node.boss{width:120px;height:120px;background:linear-gradient(135deg,#ff5d73,#ff9f36);color:#fff}
.node.boss.locked{filter:grayscale(.7)}
.side .card{padding:1em;margin-bottom:1em}
.side h3{margin:.1em 0 .4em}
.zones li{padding:.25em 0;display:flex;gap:.5em;align-items:center}
.zones{list-style:none;padding:0;margin:0}
.zones li.cur{color:var(--accent);font-weight:800}
.zones li.lock{color:var(--muted)}
.code-in{display:flex;gap:.4em;margin-top:.5em}
.code-in input{flex:1;min-width:0;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text);padding:.4em .6em;font-size:1em;text-transform:uppercase}

/* ---------- level ---------- */
.lvl{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:1em;padding:1em;max-width:1500px;width:100%;margin:0 auto}
@media (max-width:900px){.lvl{grid-template-columns:1fr}}
.board-card{padding:1em;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;position:relative}
.side-card{padding:1em;display:flex;flex-direction:column;gap:.8em}
.instr{display:flex;gap:.7em;align-items:flex-start}
.instr .bubble{background:var(--panel2);border-radius:18px;padding:.6em .9em;position:relative;flex:1;font-size:1.05em;line-height:1.3}
.instr .bubble::before{content:"";position:absolute;left:-10px;top:18px;border:10px solid transparent;border-right-color:var(--panel2);border-left:0}
.hint{background:color-mix(in srgb,var(--gold) 20%,transparent);border:2px dashed var(--gold);border-radius:16px;padding:.5em .8em;animation:pop .4s}
.stars-row{font-size:1.2em;letter-spacing:2px}
.boss-banner{background:linear-gradient(90deg,#ff5d73,#ff9f36);color:#fff;border-radius:16px;padding:.4em .8em;font-weight:800;display:flex;align-items:center;gap:.5em}

/* grid board */
.grid{position:relative;display:grid;gap:6px;padding:8px;border-radius:20px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.cell{border-radius:12px;background:var(--cell);position:relative;display:flex;align-items:center;justify-content:center}
.cell:nth-child(odd){background:var(--cell2)}
.cell.wall{background:var(--wall);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.cell.goal{background:color-mix(in srgb,var(--gold) 45%,var(--cell));box-shadow:inset 0 0 0 4px var(--gold)}
.cell .gem{font-size:.9em;animation:float 2s ease-in-out infinite}
.cell .gem.got{opacity:0;transform:scale(2);transition:.3s}
.bot{position:absolute;left:8px;top:8px;transition:transform .35s ease-in-out;z-index:3;pointer-events:none}
.bot .dir{position:absolute;inset:0;transition:transform .25s}
.bot .dir::after{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);border:10px solid transparent;border-bottom:16px solid var(--gold);border-top:0}
.bot.crash{animation:shake .4s}
.maptabs{display:flex;gap:.4em;margin-bottom:.6em}
.maptabs span{padding:.1em .8em;border-radius:99px;background:var(--panel2);font-weight:700}
.maptabs span.on{background:var(--accent);color:#08112e}
.maptabs span.ok{background:var(--c1);color:#08112e}

/* tap programming */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;max-width:320px;margin:0 auto}
.pad .btn{font-size:1.8em;padding:.25em 0;border-radius:20px}
.pad .up{grid-column:2} .pad .left{grid-column:1;grid-row:2} .pad .down{grid-column:2;grid-row:2} .pad .right{grid-column:3;grid-row:2}
.arrow-btn{background:var(--mv);color:#fff}
.prog{min-height:92px;background:var(--panel2);border-radius:18px;padding:.5em;display:flex;flex-wrap:wrap;gap:.4em;align-content:flex-start;border:3px dashed var(--line)}
.prog .empty{color:var(--muted);margin:auto;text-align:center}
.pcard{width:58px;height:58px;border-radius:14px;background:var(--mv);color:#fff;font-size:1.9em;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pop .25s;position:relative;border:0}
.pcard.run{outline:4px solid var(--gold);transform:scale(1.1)}
.pcard.cyc::after{content:"↻";position:absolute;right:2px;bottom:-2px;font-size:.45em}
.ploop{display:flex;align-items:center;gap:.3em;padding:.3em;border-radius:16px;background:color-mix(in srgb,var(--ctl) 30%,transparent);border:3px solid var(--ctl)}
.ploop.open{border-style:dashed}
.ploop.run{outline:4px solid var(--gold)}
.ploop .times{background:var(--ctl);color:#2a1a00;border:0;border-radius:12px;font-weight:800;font-size:1.2em;padding:.1em .5em;min-width:3.2em}
.ploop .slot{width:40px;height:50px;border:2px dashed var(--ctl);border-radius:12px}
.ctrl-row{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
.ctrl-zone{display:flex;gap:1em;align-items:center;justify-content:center;flex-wrap:wrap}
.ctrl-zone .pad{margin:0;flex:0 0 250px}
.ctrl-col{display:flex;flex-direction:column;gap:.5em;align-items:stretch;min-width:200px}
.ctrl-col>.btn{font-size:1.2em}
.palette .blk{font-size:.8em}
.palette .blk .body{min-height:10px!important;padding:0}
.counter{font-weight:800}
.counter.over{color:var(--danger)}

/* block editor */
.blk-area{display:grid;grid-template-columns:170px minmax(0,1fr);gap:.6em;min-height:320px}
@media (max-width:520px){.blk-area{grid-template-columns:1fr}}
.palette{background:var(--panel2);border-radius:16px;padding:.5em;display:flex;flex-direction:column;gap:.45em}
.palette h4,.ws h4{margin:0;font-size:.85em;color:var(--muted)}
.ws{background:var(--panel2);border-radius:16px;padding:.5em;min-height:300px;position:relative;overflow:auto;max-height:60vh}
.blk{border-radius:10px;color:#fff;font-weight:700;font-size:.92em;position:relative;touch-action:none;cursor:grab}
.blk .hd{padding:.35em .6em;display:flex;align-items:center;gap:.35em;flex-wrap:wrap}
.blk input{width:3.4em;border:0;border-radius:8px;text-align:center;font-weight:800;font-size:1em;padding:.1em;color:#14204a;background:#fff}
.blk.mv{background:var(--mv)} .blk.ctl{background:var(--ctl);color:#2a1a00} .blk.sen{background:var(--sen)}
.blk .body{margin-left:14px;background:color-mix(in srgb,var(--panel2) 80%,transparent);border-radius:0 8px 8px 0;padding:2px 4px;min-height:34px}
.blk .ft{height:12px}
.blk .mid{padding:.15em .6em;font-size:.9em}
.blk .x{margin-left:auto;background:rgba(0,0,0,.25);border:0;border-radius:50%;width:1.5em;height:1.5em;color:#fff;font-size:.8em;line-height:1}
.blk.run>.hd{outline:3px solid var(--gold);border-radius:10px}
.blk.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.9;transform:rotate(3deg);box-shadow:var(--shadow);min-width:150px}
.blk.dragging{opacity:.3}
.slotz{height:6px;border-radius:4px;transition:height .1s}
.slotz.act{height:30px;background:color-mix(in srgb,var(--gold) 45%,transparent);border:2px dashed var(--gold)}
.ws .hint-empty{color:var(--muted);text-align:center;margin-top:3em;pointer-events:none}
.palette.trash{outline:3px dashed var(--danger)}

/* turtle */
canvas.turtle{background:var(--cell);border-radius:18px;max-width:100%;touch-action:none}

/* pattern / order / pixel / sorter */
.series{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;align-items:center;margin:1em 0}
.piece{width:78px;height:78px;border-radius:18px;background:var(--panel2);display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.piece.q{border:4px dashed var(--gold);font-size:2.2em;color:var(--gold);background:transparent;box-shadow:none}
.opts{display:flex;gap:1em;justify-content:center;flex-wrap:wrap}
.opts .piece{width:96px;height:96px}
.order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8em;width:100%;max-width:560px}
.ocard{padding:.8em;border-radius:20px;background:var(--panel2);border:0;font-size:1em;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.2em;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ocard .em{font-size:2.8em;line-height:1}
.ocard .num{position:absolute;top:-10px;left:-10px;width:2em;height:2em;border-radius:50%;background:var(--accent);color:#08112e;display:flex;align-items:center;justify-content:center;font-weight:800}
.ocard.used{opacity:.55}
.pix{display:grid;gap:3px;background:var(--wall);padding:3px;border-radius:12px}
.pix button{border:0;border-radius:6px;background:#fff}
.pixcode{font-size:.95em;display:grid;gap:.25em}
.pixcode div{display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.pixcode .rn{font-weight:800;color:var(--muted);width:2.3em}
.chip{display:inline-flex;align-items:center;gap:.15em;background:var(--panel2);padding:0 .45em;border-radius:8px;font-weight:800}
.alumno-chip{display:inline-flex;align-items:center;gap:.35em;font-weight:700;min-width:0}
.alumno-chip .btn{padding:.2em .7em;font-size:.85em}
.sw{display:inline-block;width:1em;height:1em;border-radius:4px;border:2px solid rgba(0,0,0,.25)}
.colors{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap}
.colors button{width:58px;height:58px;border-radius:50%;border:4px solid transparent;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.colors button.sel{border-color:var(--gold);transform:scale(1.12)}
.belt{width:100%;max-width:620px;position:relative;height:240px}
.belt .track{position:absolute;left:0;right:0;top:70px;height:36px;border-radius:18px;background:repeating-linear-gradient(90deg,var(--wall) 0 20px,var(--cell2) 20px 40px)}
.belt .item{position:absolute;top:44px;width:62px;height:62px;transition:left .6s ease-in-out, top .6s ease-in-out}
.belt .box{position:absolute;bottom:0;width:44%;height:100px;border-radius:0 0 20px 20px;border:4px solid var(--muted);border-top:0;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;padding:.3em;font-weight:800}
.belt .box .bl{position:absolute;top:-2.2em;left:0;right:0;text-align:center}
.rule{background:var(--panel2);border-radius:16px;padding:.6em;display:grid;gap:.4em}
.rule .row{display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.rule .kw{font-weight:800;padding:.1em .6em;border-radius:10px;background:var(--ctl);color:#2a1a00}
.sel-btn{border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:.2em .6em;font-weight:700}
.sel-btn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,var(--panel))}

/* modal / overlay */
.overlay{position:fixed;inset:0;background:rgba(5,10,30,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:1em;backdrop-filter:blur(3px)}
.modal{max-width:620px;width:100%;padding:1.4em;text-align:center;animation:pop .35s;max-height:92vh;overflow:auto}
.modal h2{margin:.2em 0;font-size:1.8em}
.bigstars{font-size:3em;letter-spacing:6px}
.bigstars .off{filter:grayscale(1);opacity:.3}
.codebox{margin:.6em auto;display:inline-block;padding:.3em 1em;border-radius:14px;background:var(--panel2);border:3px dashed var(--accent);font-size:1.6em;font-weight:800;letter-spacing:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:3px solid var(--danger);border-radius:18px;padding:.6em 1em;z-index:60;box-shadow:var(--shadow);display:flex;gap:.6em;align-items:center;max-width:92vw;animation:pop .3s;font-weight:700}
.toast.ok{border-color:var(--c1)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.tut-dots{display:flex;gap:.4em;justify-content:center;margin:.6em 0}
.tut-dots i{width:10px;height:10px;border-radius:50%;background:var(--panel2)}
.tut-dots i.on{background:var(--accent)}

/* manual & teacher */
.doc{max-width:1000px;margin:0 auto;padding:1em;width:100%}
.tabs{display:flex;gap:.5em;flex-wrap:wrap;margin-bottom:1em}
.tabs button{border:0;border-radius:14px;padding:.4em 1em;font-weight:800;background:var(--panel2)}
.tabs button.on{background:var(--accent);color:#08112e}
.man-sec{padding:1.2em;margin-bottom:1em}
.man-sec h2{margin:.1em 0 .4em;color:var(--accent)}
.man-sec h3{margin:.8em 0 .2em}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:.6em}
.steps li{counter-increment:s;display:flex;gap:.7em;align-items:flex-start;background:var(--panel2);border-radius:16px;padding:.6em .8em}
.steps li::before{content:counter(s);flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#08112e;display:flex;align-items:center;justify-content:center;font-weight:800}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.8em;height:1.8em;padding:0 .4em;border-radius:8px;background:var(--mv);color:#fff;font-weight:800;margin:0 .1em}
.kbd.o{background:var(--ctl);color:#2a1a00}.kbd.g{background:var(--accent);color:#08112e}.kbd.s{background:var(--sen)}
.retos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8em}
.reto{background:var(--panel2);border-radius:16px;padding:.8em}
.reto b{display:block;font-size:1.05em}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:.4em;text-align:left;vertical-align:top}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.5em 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.switch{width:64px;height:34px;border-radius:99px;border:0;background:var(--panel2);position:relative}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:34px;background:#fff}
.timer{position:fixed;right:14px;bottom:14px;z-index:40;padding:.4em .8em;font-size:1.6em;font-weight:800;display:flex;gap:.4em;align-items:center}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
@media print{
  body{background:#fff!important;color:#000;font-size:13px}

  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v==null || v===false) continue;
    if (k==='class') e.className = v;
    else if (k==='style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k==='html') e.innerHTML = v;
    else e.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
};

/* ================= sonido y voz ================= */
let actx=null;
function beep(type){
  if(!S.settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seqs = {step:[[520,.06]], ok:[[523,.1],[659,.1],[784,.1],[1046,.25]], bad:[[300,.12],[200,.25]], tap:[[700,.04]], boss:[[392,.15],[523,.15],[659,.15],[784,.15],[1046,.4]]};
    let t = actx.currentTime;
    for(const [f,d] of seqs[type]||seqs.tap){
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = type==='bad'?'sawtooth':'square'; o.frequency.value=f;
      g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d); t+=d*.9;
    }
  }catch(e){}
}
function speak(txt){
  if(!S.settings.voice || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const clean = String(txt).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}▶↑↓←→↻↺⌫✔✕]/gu,' ').replace(/\s+/g,' ');
    const u = new SpeechSynthesisUtterance(clean);
    u.lang='es-ES'; u.rate=.95; u.pitch=1.15;
    const v = speechSynthesis.getVoices().find(v=>v.lang==='es-ES') || speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= mapas de cuadrícula ================= */
function parseMap(m){
  const rows = m.rows, H = rows.length, W = rows[0].length;
  const o = {w:W, h:H, walls:new Set(), gems:[], start:null, goal:null, dir:m.dir||0};
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{
    if(ch==='#') o.walls.add(x+','+y);
    if(ch==='*') o.gems.push([x,y]);
    if(ch==='S') o.start=[x,y];
    if(ch==='G') o.goal=[x,y];
  }));
  return o;
}

const CODE_WORDS = ['TUERCA','CHIP','PISTON','SENSOR','CABLE','MOTOR'];
function levelCode(c, n){ return CODE_WORDS[n-1] + '-' + String((c*37 + n*11 + 7) % 90 + 10); }
function redeemCode(txt){
  const t = txt.trim().toUpperCase().replace(/\s+/g,'').replace('PISTÓN','PISTON');
  for(const c of [1,2,3]) for(let n=1;n<=6;n++){
    if(levelCode(c,n)===t){
      const all = allLevels(c);
      for(let i=0;i<n;i++) if(!S.progress[c][all[i].id]) S.progress[c][all[i].id]=1;
      saveProgress(); return {c,n};
    }
  }
  return null;
}
const allLevels = c => [...CICLOS[c].levels, CICLOS[c].boss];
function doneCount(c){ return allLevels(c).filter(l=>S.progress[c][l.id]).length; }
function isUnlocked(c, idx){ if(S.settings.unlockAll) return true; if(idx===0) return true; const all=allLevels(c); return !!S.progress[c][all[idx-1].id]; }

/* ================= progreso en la nube (solo alumnado con clave) ================= */
// Firebase solo se descarga si hay un alumno con clave en este
// dispositivo. nube() devuelve una promesa con window.ChispaNube, o
// null si no hay clave o no carga en 10 segundos.
let promesaNube = null;
function nube(){
  if(promesaNube) return promesaNube;
  if(!ALUMNO) return (promesaNube = Promise.resolve(null));
  promesaNube = new Promise(resolve=>{
    if(window.ChispaNube) return resolve(window.ChispaNube);
    let hecho=false; const fin=v=>{ if(!hecho){ hecho=true; resolve(v); } };
    document.addEventListener('chispa:nube-lista', ()=>fin(window.ChispaNube), {once:true});
    setTimeout(()=>fin(window.ChispaNube||null), 10000);
    const config=document.createElement('script');
    config.src='../js/firebase-config.js';
    config.onload=()=>{ const m=document.createElement('script'); m.type='module'; m.src='js/nube.js'; m.onerror=()=>fin(null); document.head.appendChild(m); };
    config.onerror=()=>fin(null);
    document.head.appendChild(config);
  });
  return promesaNube;
}
// Resumen por ciclo para el panel docente, que así no necesita
// conocer la lista de retos.
function resumenProgreso(){
  const r={};
  for(const c of [1,2,3]){
    const all=allLevels(c);
    r[c]={retos:all.filter(l=>S.progress[c][l.id]).length, total:all.length, estrellas:Object.values(S.progress[c]).reduce((a,b)=>a+b,0)};
  }
  return r;
}
function guardarEnNube(){ if(ALUMNO) nube().then(n=>{ if(n) return n.guardar(S.progress, resumenProgreso()); }).catch(()=>{}); }
// Al abrir: se juntan el progreso de este equipo y el de la nube
// quedándose con las mejores estrellas de cada reto, así no se pierde
// nada de lo jugado en otro ordenador ni lo jugado aquí sin conexión.
async function sincronizarDesdeNube(){
  const n = await nube(); if(!n) return;
  let remoto; try{ remoto = await n.cargar(); }catch(e){ return; }
  let cambia=false, subir=!remoto;
  for(const c of [1,2,3]){
    const r=(remoto&&remoto[c])||{};
    for(const [id,st] of Object.entries(r)) if((S.progress[c][id]||0)<st){ S.progress[c][id]=st; cambia=true; }
    for(const [id,st] of Object.entries(S.progress[c])) if((r[id]||0)<st) subir=true;
  }
  store.set(PROGRESS_KEY, S.progress);
  if(subir) guardarEnNube();
  if(cambia && vistaActual) vistaActual();
}

  if(!confirm('¿Salir de tu clave en este ordenador? Para volver a entrar necesitarás tu clave.')) return;
  // Borra lo mismo que clearStudentSession() en js/auth.js.
  try{ ['ar_estudiante','ar_visibilidad','ar_soluciones'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  location.reload();
}

/* ================= intérprete ================= */
function countBlocks(list){ let n=0; for(const b of list){ n++; if(b.body) n+=countBlocks(b.body); if(b.els) n+=countBlocks(b.els); } return n; }
function* interp(list, env){
  for(const b of list){
    if(b.t==='rep'){ for(let k=0;k<b.n;k++){ yield {b, act:'loop'}; yield* interp(b.body, env); } }
    else if(b.t==='if'){ yield {b, act:'check'}; yield* interp(env.wallAhead()?b.body:b.els, env); }
    else yield {b, act:b.t};
  }
}
function markRun(b, on){ if(b && b._el) b._el.classList.toggle('run', on); }

/* ================= juego de cuadrícula ================= */
function initGrid(ctx, board, side){
  const {lv, c, C} = ctx;
  const maps = (lv.maps||[lv.map]).map(parseMap);
  const rel = !!lv.rel;
  let cur = 0, running = false, stopFlag = false;
  let program = lv.given ? clone(lv.given) : [];
  const tabs = maps.length>1 ? h('div',{class:'maptabs'}, maps.map((_,i)=>h('span',{},'Mapa '+(i+1)))) : null;
  const gridHost = h('div');
  board.append(tabs||'', gridHost);
  let st, cs, botEl, dirEl, cellEls;
  function build(mi){
    cur = mi; const m = maps[mi];
    if(tabs) [...tabs.children].forEach((t,i)=>t.classList.toggle('on',i===mi));
    const availW = Math.max(240, board.clientWidth-40), availH = Math.max(260, Math.min(window.innerHeight*.68, 640));
    cs = Math.floor(Math.min(availW/m.w, availH/m.h, c===3?92:135)) - 6;
    gridHost.innerHTML='';
    const g = h('div',{class:'grid',style:`grid-template-columns:repeat(${m.w},${cs}px);grid-auto-rows:${cs}px;font-size:${cs*.5}px`});
    cellEls = {};
    for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){
      const k=x+','+y, cell=h('div',{class:'cell'});
      if(m.walls.has(k)){ cell.classList.add('wall'); cell.append(h('span',{style:'font-size:.8em'}, c===3?'🧱':'📦')); }
      if(m.goal && m.goal[0]===x && m.goal[1]===y){ cell.classList.add('goal'); cell.append(h('span',{},'⚡')); }
      if(m.gems.some(g=>g[0]===x&&g[1]===y)) cell.append(h('span',{class:'gem'}, GEM[c]));
      cellEls[k]=cell; g.append(cell);
    }
    botEl = h('div',{class:'bot',style:`width:${cs}px;height:${cs}px`});
    dirEl = h('div',{class:'dir'+(rel?'':' hidden')});
    const r = svgEl(robotSVG(C.color, cs*.78)); r.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-52%)';
    botEl.append(dirEl, r); g.append(botEl);
    gridHost.append(g);
    reset();
  }
  function reset(){
    const m = maps[cur];
    st = {x:m.start[0], y:m.start[1], d:m.dir||0, gems:new Set(), steps:0};
    Object.values(cellEls).forEach(e=>{ const g=e.querySelector('.gem'); if(g) g.classList.remove('got'); });
    place(true);
  }
  function place(instant){
    const gap=6;
    if(instant) botEl.style.transition='none';
    botEl.style.transform = `translate(${st.x*(cs+gap)}px,${st.y*(cs+gap)}px)`;
    dirEl.style.transform = `rotate(${st.d*90}deg)`;
    if(instant){ botEl.offsetHeight; botEl.style.transition=''; }
  }
  const blocked = (x,y)=>{ const m=maps[cur]; return x<0||y<0||x>=m.w||y>=m.h||m.walls.has(x+','+y); };
  const env = { wallAhead:()=>{ const [dx,dy]=DIRV[st.d]; return blocked(st.x+dx, st.y+dy); } };
  const won = ()=>{ const m=maps[cur]; return st.x===m.goal[0] && st.y===m.goal[1] && st.gems.size===m.gems.length; };
  const delay = ()=> (c===3?260:420)/S.settings.speed;
  async function stepTo(dir){
    const [dx,dy]=DIRV[dir], nx=st.x+dx, ny=st.y+dy;
    if(blocked(nx,ny)){
      botEl.classList.remove('crash'); botEl.offsetWidth; botEl.classList.add('crash');
      throw {msg: (nx<0||ny<0||nx>=maps[cur].w||ny>=maps[cur].h) ? '¡Uy! Chispa se sale del tablero.' : '¡Pum! Chispa se ha chocado con un obstáculo.'};
    }
    st.x=nx; st.y=ny; place(); beep('step');
    const m=maps[cur]; const gi = m.gems.findIndex(g=>g[0]===nx&&g[1]===ny);
    if(gi>=0 && !st.gems.has(gi)){ st.gems.add(gi); const ge=cellEls[nx+','+ny].querySelector('.gem'); if(ge) ge.classList.add('got'); }
    await sleep(delay());
  }
  async function runOn(mi){
    build(mi); await sleep(300);
    const it = interp(program, env);
    let prevB = null;
    for(const step of it){
      if(stopFlag) throw {stop:true};
      if(++st.steps>400) throw {msg:'Demasiados pasos. ¿Se repite algo de más?'};
      markRun(prevB,false); markRun(step.b,true); prevB=step.b;
      const a=step.act;
      if(a in ABS){ st.d=ABS[a]; await stepTo(ABS[a]); }
      else if(a==='fwd'){ for(let k=0;k<(step.b.n||1);k++){ await stepTo(st.d); if(won()) break; } }
      else if(a==='tl'||a==='tr'){ st.d=(st.d+(a==='tr'?1:3))%4; place(); beep('tap'); await sleep(delay()); }
      else await sleep(delay()*.35);
      if(won()){ markRun(prevB,false); return true; }
    }
    markRun(prevB,false);
    const m=maps[cur];
    if(st.gems.size<m.gems.length) throw {msg:`Faltan ${m.gems.length-st.gems.size} ${c===3?'cristal(es)':'engranaje(s)'} por recoger.`};
    throw {msg:'Chispa no ha llegado al cargador ⚡. ¡Revisa el programa!'};
  }
  async function run(){
    if(running) return;
    if(!program.length){ toast('El programa está vacío. Añade bloques primero.'); return; }
    if(countBlocks(program)>lv.max){ ctx.fail(`Usas ${countBlocks(program)} bloques y el máximo es ${lv.max}.`); editor.shakeCount(); return; }
    running=true; stopFlag=false; editor.setRunning(true);
    try{
      for(let mi=0; mi<maps.length; mi++){
        await runOn(mi);
        if(tabs) tabs.children[mi].classList.add('ok');
      }
      const used = countBlocks(program), opt = countBlocks(lv.sol);
      let stars = used<=opt ? 3 : used<=opt+2 ? 2 : 1;
      if(ctx.fails>=3 && stars>2) stars=2;
      await sleep(250);
      ctx.win(stars);
    }catch(e){
      if(e && e.stop){ build(0); }
      else { ctx.fail(e.msg||'Algo ha fallado'); await sleep(900); if(tabs)[...tabs.children].forEach(t=>t.classList.remove('ok')); build(cur); }
    }finally{ running=false; editor.setRunning(false); }
  }
  const editor = (C.edit==='blocks')
    ? blockEditor(side, lv, ()=>program, p=>{program=p;}, run, ()=>{stopFlag=true;})
    : tapEditor(side, lv, C, ()=>program, p=>{program=p;}, run, ()=>{stopFlag=true;});
  ctx.showSolution = ()=>{ program = clone(lv.sol); editor.refresh(); toast('Observa la solución y pulsa ▶', true); };
  requestAnimationFrame(()=>build(0));
  const onR = ()=>{ if(!running) build(cur); };
  window.addEventListener('resize', onR); cleanup.push(()=>window.removeEventListener('resize', onR));
}

/* ----- editor por toques (1.º y 2.º ciclo, pizarra) ----- */
function tapEditor(side, lv, C, get, set, run, stop){
  let open = null; // bucle abierto
  const loopsOn = C.loops && !lv.noLoop;
  const progBox = h('div',{class:'prog'});
  const counter = h('span',{class:'counter'});
  const runBtn = h('button',{class:'btn primary',style:'font-size:1.3em',onclick:run},'▶ ¡Adelante!');
  const stopBtn = h('button',{class:'btn danger hidden',onclick:stop},'■ Parar');
  const add = (node)=>{
    const p=get();
    if(countBlocks(p)+1>lv.max){ beep('bad'); shakeCount(); toast(`Máximo ${lv.max} bloques en este reto.`); return; }
    (open?open.body:p).push(node); beep('tap'); refresh();
  };
  const dirs = ['up','left','down','right'];
  const pad = h('div',{class:'pad'}, dirs.map(d=>h('button',{class:'btn arrow-btn '+d,'aria-label':ABS_NAME[d],onclick:()=>add(mv(d))},ARW[d])));
  const loopBtn = h('button',{class:'btn',style:'background:var(--ctl);color:#2a1a00',onclick:()=>{
    if(open){ open=null; refresh(); return; }
    const p=get(); if(countBlocks(p)+1>lv.max){ beep('bad'); shakeCount(); toast(`Máximo ${lv.max} bloques.`); return; }
    open = {t:'rep',n:2,body:[]}; p.push(open); beep('tap'); refresh();
  }});
  const undo = ()=>{
    const p=get();
    if(open){ if(open.body.length) open.body.pop(); else { p.splice(p.indexOf(open),1); open=null; } }
    else { const last=p.pop(); }
    refresh();
  };
  function shakeCount(){ counter.classList.remove('shake'); counter.offsetWidth; counter.classList.add('shake'); }
  function card(b){
    const el = h('button',{class:'pcard'+(lv.cycle?' cyc':''),'aria-label':ABS_NAME[b.t]}, ARW[b.t]);
    if(lv.cycle) el.onclick=()=>{ const order=['up','right','down','left']; b.t=order[(order.indexOf(b.t)+1)%4]; beep('tap'); refresh(); };
    b._el = el; return el;
  }
  function refresh(){
    const p=get();
    if(open && !p.includes(open)) open=null;
    progBox.innerHTML='';
    if(!p.length) progBox.append(h('div',{class:'empty'},'Tu programa está vacío. Pulsa las flechas ⬇'));
    for(const b of p){
      if(b.t==='rep'){
        const times = h('button',{class:'times',title:'Cambiar número',onclick:()=>{ b.n = b.n>=8?2:b.n+1; beep('tap'); refresh(); }}, `🔁 ×${b.n}`);
        const lp = h('div',{class:'ploop'+(b===open?' open':''), onclick:e=>{ if(e.target===lp && !lv.cycle){ open = (open===b?null:b); refresh(); } }}, times, b.body.map(card), b===open?h('div',{class:'slot',title:'Las flechas irán aquí'}):null);
        b._el = lp; progBox.append(lp);
      } else progBox.append(card(b));
    }
    const n=countBlocks(p);
    counter.textContent = `Bloques: ${n} / ${lv.max}`;
    counter.classList.toggle('over', n>lv.max);
    loopBtn.textContent = open ? '✔ Cerrar repetir' : '🔁 Repetir';
  }
  side.append(
    h('div',{style:'display:flex;justify-content:space-between;align-items:center'}, h('b',{},'🧩 Tu programa'), counter),
    progBox,
    h('div',{class:'muted',style:'text-align:center;font-size:.9em'}, lv.cycle?'Toca una flecha del programa para cambiarla ↻':'Pulsa las flechas para añadir pasos'),
    h('div',{class:'ctrl-zone'},
      pad,
      h('div',{class:'ctrl-col'},
        loopsOn ? loopBtn : null,
        h('div',{class:'ctrl-row'},
          h('button',{class:'btn',onclick:undo},'⌫ Borrar'),
          h('button',{class:'btn',onclick:()=>{ set([]); open=null; refresh(); }},'🗑️ Todo')),
        runBtn, stopBtn))
  );
  refresh();
  return { refresh:()=>{ open=null; refresh(); }, shakeCount, setRunning:r=>{ runBtn.classList.toggle('hidden',r); stopBtn.classList.toggle('hidden',!r); } };
}

/* ----- editor de bloques (3.er ciclo, ordenador) ----- */
const BLOCK_DEF = {
  fwd:{cls:'mv', make:tur=>({t:'fwd',n:tur?50:1})},
  tr:{cls:'mv', make:tur=>tur?{t:'tr',n:90}:{t:'tr'}},
  tl:{cls:'mv', make:tur=>tur?{t:'tl',n:90}:{t:'tl'}},
  rep:{cls:'ctl', make:()=>({t:'rep',n:4,body:[]})},
  if:{cls:'sen', make:()=>({t:'if',body:[],els:[]})}
};
function blockEditor(side, lv, get, set, run, stop){
  const tur = lv.type==='turtle';
  const ws = h('div',{class:'ws'});
  const palette = h('div',{class:'palette'}, h('h4',{},'BLOQUES'));
  const counter = h('span',{class:'counter'});
  const runBtn = h('button',{class:'btn primary',style:'font-size:1.15em',onclick:run},'▶ Ejecutar');
  const stopBtn = h('button',{class:'btn danger hidden',onclick:stop},'■ Parar');
  let slots = [], drag = null;

  function numInput(b, min, max){
    const i = h('input',{type:'number',min,max,value:b.n});
    i.addEventListener('pointerdown',e=>e.stopPropagation());
    i.addEventListener('change',()=>{ let v=parseInt(i.value,10); if(isNaN(v)) v=min; v=Math.max(min,Math.min(max,v)); b.n=v; i.value=v; });
    return i;
  }
  function header(b, live){
    const parts = [];
    if(b.t==='fwd') parts.push('avanzar', live?numInput(b,1,tur?300:9):h('span',{class:'chip',style:'color:#14204a;background:#fff'},tur?'50':'1'), 'pasos');
    if(b.t==='tr') parts.push('girar ↻ derecha', tur?(live?numInput(b,1,360):h('span',{class:'chip',style:'color:#14204a;background:#fff'},'90')):null, tur?'°':null);
    if(b.t==='tl') parts.push('girar ↺ izquierda', tur?(live?numInput(b,1,360):h('span',{class:'chip',style:'color:#14204a;background:#fff'},'90')):null, tur?'°':null);
    if(b.t==='rep') parts.push('🔁 repetir', live?numInput(b,1,50):h('span',{class:'chip',style:'color:#14204a;background:#fff'},'4'), 'veces');
    if(b.t==='if') parts.push('📡 si hay muro delante');
    return parts.filter(Boolean);
  }
  // paleta
  for(const t of lv.blocks){
    const proto = BLOCK_DEF[t].make(tur);
    const el = h('div',{class:'blk '+BLOCK_DEF[t].cls, title:'Arrastra o toca para añadir'}, h('div',{class:'hd'}, header(proto,false)));
    if(t==='rep'||t==='if') el.append(h('div',{class:'body',style:'min-height:14px'}), t==='if'?h('div',{class:'mid'},'si no'):null, t==='if'?h('div',{class:'body',style:'min-height:14px'}):null, h('div',{class:'ft'}));
    attachDrag(el, ()=>BLOCK_DEF[t].make(tur), null);
    palette.append(el);
  }
  palette.append(h('div',{class:'muted',style:'font-size:.78em;margin-top:auto'},'Arrastra un bloque aquí para borrarlo 🗑️'));

  function render(){
    ws.innerHTML=''; slots=[];
    ws.append(h('h4',{},'MI PROGRAMA ▼'));
    const p=get();
    const root = h('div');
    renderList(p, root);
    ws.append(root);
    if(!p.length) ws.append(h('div',{class:'hint-empty'},'Arrastra aquí los bloques ⬅'));
    const n=countBlocks(p);
    counter.textContent=`Bloques: ${n} / ${lv.max}`;
    counter.classList.toggle('over', n>lv.max);
  }
  function renderList(list, host){
    list.forEach((b,i)=>{ host.append(slot(list,i)); host.append(blockEl(b,list)); });
    host.append(slot(list,list.length));
  }
  function slot(list, i){ const s=h('div',{class:'slotz'}); slots.push({el:s,list,i}); return s; }
  function blockEl(b, list){
    const el = h('div',{class:'blk '+BLOCK_DEF[b.t].cls});
    const x = h('button',{class:'x',title:'Borrar','aria-label':'Borrar bloque',onclick:()=>{ list.splice(list.indexOf(b),1); render(); }},'✕');
    x.addEventListener('pointerdown',e=>e.stopPropagation());
    el.append(h('div',{class:'hd'}, header(b,true), x));
    if(b.t==='rep'||b.t==='if'){
      const body=h('div',{class:'body'}); renderList(b.body, body); el.append(body);
      if(b.t==='if'){ el.append(h('div',{class:'mid'},'si no')); const e2=h('div',{class:'body'}); renderList(b.els,e2); el.append(e2); }
      el.append(h('div',{class:'ft'}));
    }
    b._el = el;
    attachDrag(el, ()=>b, list);
    return el;
  }
  function contains(node, list){ // ¿list está dentro de node?
    if(!node.body) return false;
    if(node.body===list || node.els===list) return true;
    return [...node.body, ...(node.els||[])].some(k=>contains(k,list));
  }
  function attachDrag(el, getNode, fromList){
    el.addEventListener('pointerdown', e=>{
      if(e.button!==0 || e.target.closest('input,.x')) return;
      e.stopPropagation();
      const sx=e.clientX, sy=e.clientY; let started=false; let ghost=null;
      const node0 = fromList ? getNode() : null;
      const move = ev=>{
        if(!started){
          if(Math.hypot(ev.clientX-sx, ev.clientY-sy)<6) return;
          started=true;
          const node = fromList ? node0 : getNode();
          drag = {node, fromList};
          ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width=Math.min(el.offsetWidth,260)+'px';
          document.body.append(ghost);
          if(fromList) el.classList.add('dragging');
        }
        ghost.style.left=(ev.clientX-20)+'px'; ghost.style.top=(ev.clientY-14)+'px';
        highlight(ev.clientX, ev.clientY);
      };
      const upH = ev=>{
        window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',upH);
        if(!started){ // toque: añadir al final (solo desde la paleta)
          if(!fromList) addNode(getNode(), get(), get().length);
          return;
        }
        ghost.remove(); el.classList.remove('dragging'); palette.classList.remove('trash');
        const target = highlight(ev.clientX, ev.clientY);
        slots.forEach(s=>s.el.classList.remove('act'));
        const {node} = drag; drag=null;
        if(target){
          if(fromList){
            if(node===target.list || contains(node, target.list)){ render(); return; }
            const oi = fromList.indexOf(node); let ti = target.i;
            fromList.splice(oi,1);
            if(fromList===target.list && oi<ti) ti--;
            target.list.splice(ti,0,node); render();
          } else addNode(node, target.list, target.i);
        } else if(fromList){
          fromList.splice(fromList.indexOf(node),1); beep('tap'); render();
        }
      };
      window.addEventListener('pointermove',move); window.addEventListener('pointerup',upH);
    });
  }
  function addNode(node, list, i){
    if(countBlocks(get())+countBlocks([node])>lv.max){ beep('bad'); shakeCount(); toast(`Máximo ${lv.max} bloques en este reto.`); return; }
    list.splice(i,0,node); beep('tap'); render();
  }
  function highlight(x,y){
    slots.forEach(s=>s.el.classList.remove('act'));
    const pr = palette.getBoundingClientRect();
    palette.classList.toggle('trash', !!(drag && drag.fromList && x>=pr.left&&x<=pr.right&&y>=pr.top&&y<=pr.bottom));
    const r = ws.getBoundingClientRect();
    if(x<r.left||x>r.right||y<r.top||y>r.bottom) return null;
    let best=null, bd=1e9;
    for(const s of slots){
      if(drag && drag.fromList && contains(drag.node, s.list)) continue;
      const b=s.el.getBoundingClientRect();
      const dy = Math.abs((b.top+b.bottom)/2 - y);
      const dx = x<b.left ? (b.left-x) : x>b.right ? (x-b.right) : 0;
      const d = dy + dx*.6;
      if(d<bd){ bd=d; best=s; }
    }
    if(best) best.el.classList.add('act');
    return best;
  }
  function shakeCount(){ counter.classList.remove('shake'); counter.offsetWidth; counter.classList.add('shake'); }
  side.append(
    h('div',{style:'display:flex;justify-content:space-between;align-items:center'}, h('b',{},'🧩 Programa con bloques'), counter),
    h('div',{class:'blk-area'}, palette, ws),
    h('div',{class:'ctrl-row'}, runBtn, stopBtn, h('button',{class:'btn',onclick:()=>{ set([]); render(); }},'🗑️ Vaciar'))
  );
  render();
  return { refresh:render, shakeCount, setRunning:r=>{ runBtn.classList.toggle('hidden',r); stopBtn.classList.toggle('hidden',!r); ws.style.pointerEvents=r?'none':''; } };
}

/* ================= robot dibujante (tortuga) ================= */
function traceTurtle(prog, start){
  const segs=[]; let x=start.x, y=start.y, a=start.a, n=0;
  const walk = list=>{ for(const b of list){ if(++n>2000) throw {msg:'Demasiados pasos'}; if(b.t==='rep'){ for(let k=0;k<b.n;k++) walk(b.body); } else if(b.t==='fwd'){ const nx=x+Math.cos(a*Math.PI/180)*b.n, ny=y+Math.sin(a*Math.PI/180)*b.n; segs.push([x,y,nx,ny]); x=nx; y=ny; } else if(b.t==='tr') a=(a+b.n)%360; else if(b.t==='tl') a=(a-b.n+360)%360; } };
  walk(prog); return segs;
}
function segDist(px,py,[x1,y1,x2,y2]){ const dx=x2-x1, dy=y2-y1, l=dx*dx+dy*dy; let t=l?((px-x1)*dx+(py-y1)*dy)/l:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(x1+t*dx), py-(y1+t*dy)); }
function covers(A, B, tol=4){ // cada punto de A está cerca de algún segmento de B
  for(const s of A){ const L=Math.hypot(s[2]-s[0],s[3]-s[1]); const k=Math.max(1,Math.ceil(L/4)); for(let i=0;i<=k;i++){ const px=s[0]+(s[2]-s[0])*i/k, py=s[1]+(s[3]-s[1])*i/k; if(!B.some(b=>segDist(px,py,b)<=tol)) return false; } }
  return true;
}
function initTurtle(ctx, board, side){
  const {lv, C, c} = ctx;
  const target = traceTurtle(lv.sol, lv.start);
  let program=[], running=false, stopFlag=false;
  const SIZE=360, cv=h('canvas',{class:'turtle'}), g=cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  function fit(){ const s=Math.min(board.clientWidth-40, window.innerHeight*.66, 560); cv.style.width=s+'px'; cv.style.height=s+'px'; cv.width=s*dpr; cv.height=s*dpr; }
  const robotImg = new Image(); robotImg.src='data:image/svg+xml;utf8,'+encodeURIComponent(robotSVG(C.color,40).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));
  function draw(segs, tx, ty, ta, partial){
    const k = cv.width/SIZE; g.setTransform(k,0,0,k,0,0);
    g.clearRect(0,0,SIZE,SIZE);
    g.strokeStyle='rgba(130,170,255,.18)'; g.lineWidth=1;
    for(let i=0;i<=SIZE;i+=20){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,SIZE); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(SIZE,i); g.stroke(); }
    g.setLineDash([8,7]); g.strokeStyle='#ffd23f'; g.lineWidth=4; g.lineCap='round';
    for(const s of target){ g.beginPath(); g.moveTo(s[0],s[1]); g.lineTo(s[2],s[3]); g.stroke(); }
    g.setLineDash([]); g.strokeStyle=C.color; g.lineWidth=5;
    for(const s of segs.concat(partial?[partial]:[])){ g.beginPath(); g.moveTo(s[0],s[1]); g.lineTo(s[2],s[3]); g.stroke(); }
    g.save(); g.translate(tx,ty); g.rotate((ta+90)*Math.PI/180);
    g.fillStyle='#ffd23f'; g.beginPath(); g.moveTo(0,-30); g.lineTo(-8,-18); g.lineTo(8,-18); g.fill();
    g.restore();
    if(robotImg.complete) g.drawImage(robotImg, tx-18, ty-20, 36, 40);
  }
  robotImg.onload=()=>reset();
  function reset(){ draw([], lv.start.x, lv.start.y, lv.start.a); }
  board.append(h('div',{class:'muted',style:'margin-bottom:.4em'},'Modelo: línea amarilla punteada'), cv);
  async function run(){
    if(running) return;
    if(!program.length){ toast('El programa está vacío.'); return; }
    if(countBlocks(program)>lv.max){ ctx.fail(`Usas ${countBlocks(program)} bloques y el máximo es ${lv.max}.`); editor.shakeCount(); return; }
    running=true; stopFlag=false; editor.setRunning(true);
    let x=lv.start.x, y=lv.start.y, a=lv.start.a; const segs=[]; let steps=0, prevB=null;
    try{
      for(const st of interp(program,{wallAhead:()=>false})){
        if(stopFlag) throw {stop:true};
        if(++steps>600) throw {msg:'Demasiados pasos. Revisa los números de repetir.'};
        markRun(prevB,false); markRun(st.b,true); prevB=st.b;
        const b=st.b, sp = 1/S.settings.speed;
        if(st.act==='fwd'){
          const nx=x+Math.cos(a*Math.PI/180)*b.n, ny=y+Math.sin(a*Math.PI/180)*b.n;
          const frames=Math.max(6, Math.round(Math.abs(b.n)/6*sp));
          for(let f=1;f<=frames;f++){ const px=x+(nx-x)*f/frames, py=y+(ny-y)*f/frames; draw(segs,px,py,a,[x,y,px,py]); await sleep(16); }
          segs.push([x,y,nx,ny]); x=nx; y=ny; beep('step');
        } else if(st.act==='tr'||st.act==='tl'){
          const to = a + (st.act==='tr'?b.n:-b.n); const frames=Math.max(4,Math.round(Math.abs(b.n)/12*sp));
          for(let f=1;f<=frames;f++){ draw(segs,x,y,a+(to-a)*f/frames); await sleep(16); }
          a=((to%360)+360)%360;
        } else await sleep(80*sp);
      }
      markRun(prevB,false);
      draw(segs,x,y,a);
      const ok = segs.length && covers(segs,target) && covers(target,segs);
      if(!ok){ const e = segs.some(s=>!covers([s],target)) ? 'El dibujo se sale del modelo. Revisa los números de avanzar y los grados.' : 'Falta parte del dibujo. ¿Repites suficientes veces?'; throw {msg:e}; }
      const used=countBlocks(program), opt=countBlocks(lv.sol);
      let stars = used<=opt?3:used<=opt+2?2:1; if(ctx.fails>=3&&stars>2) stars=2;
      await sleep(400); ctx.win(stars);
    }catch(e){
      markRun(prevB,false);
      if(!(e&&e.stop)){ ctx.fail(e.msg||'Error'); await sleep(1200); }
      reset();
    }finally{ running=false; editor.setRunning(false); }
  }
  const editor = blockEditor(side, lv, ()=>program, p=>{program=p;}, run, ()=>{stopFlag=true;});
  side.insertBefore(h('div',{class:'muted',style:'font-size:.9em'},'📐 Recuerda: una vuelta completa = 360°. La flecha amarilla indica hacia dónde mira Chispa.'), side.lastChild);
  ctx.showSolution=()=>{ program=clone(lv.sol); editor.refresh(); toast('Observa la solución y pulsa ▶', true); };
  requestAnimationFrame(()=>{ fit(); reset(); });
  const onR=()=>{ if(!running){ fit(); reset(); } };
  window.addEventListener('resize',onR); cleanup.push(()=>window.removeEventListener('resize',onR));
}

/* ================= series ================= */
function initPattern(ctx, board, side){
  const {lv} = ctx; let r=0, errors=0;
  const prog = h('div',{class:'muted',style:'font-weight:700'});
  function render(){
    board.innerHTML='';
    const R = lv.rounds[r];
    prog.textContent = `Serie ${r+1} de ${lv.rounds.length}`;
    board.append(prog,
      h('div',{class:'series'}, R.seq.map(p=>h('div',{class:'piece',html:shapeSVG(p[0],p[1],56)})), h('div',{class:'piece q'},'?')),
      h('div',{class:'muted',style:'margin:.4em 0'},'¿Cuál va en el hueco?'),
      h('div',{class:'opts'}, R.opts.map((p,i)=>{
        const b = h('button',{class:'piece',html:shapeSVG(p[0],p[1],72),'aria-label':p[0]+' '+p[1],onclick:async()=>{

            r++; if(r>=lv.rounds.length) ctx.win(errors===0?3:errors<=2?2:1); else render(); }

/* ================= ordenar pasos ================= */
function initOrder(ctx, board, side){
  const {lv} = ctx; let next=0, errors=0;
  const order = lv.steps.map((s,i)=>({s,i}));
  do { order.sort(()=>Math.random()-.5); } while(order.every((o,k)=>o.i===k));
  const grid = h('div',{class:'order-grid'});
  const line = h('div',{class:'series'});
  order.forEach(o=>{
    const b = h('button',{class:'ocard',onclick:async()=>{
      if(b.classList.contains('used')) return;
      if(o.i===next){ beep('ok'); next++; b.classList.add('used'); b.append(h('span',{class:'num'},String(next)));
        line.append(h('div',{class:'piece',style:'font-size:2.4em',title:o.s[1]}, o.s[0]));
        if(next===lv.steps.length){ await sleep(700); ctx.win(errors===0?3:errors<=2?2:1); } }
      else { errors++; b.classList.remove('shake'); b.offsetWidth; b.classList.add('shake'); ctx.fail(next===0?'¿Eso es lo primero que hay que hacer?':'Todavía no toca ese paso. ¿Qué va antes?'); }
    }}, h('span',{class:'em'},o.s[0]), o.s[1]);
    grid.append(b);
  });
  board.append(h('div',{class:'muted',style:'font-weight:700'},'Toca en orden: 1.º, 2.º, 3.º, 4.º'), grid, h('div',{class:'muted',style:'margin-top:1em'},'Algoritmo de Chispa:'), line);
  side.append(h('div',{class:'muted'},'💬 Para comentar en clase: ¿qué pasaría si cambiamos el orden? Un ALGORITMO es una lista de pasos en orden.'));
}

/* ================= pixel art por código ================= */
function initPixel(ctx, board, side){
  const {lv} = ctx; const H=lv.rows.length, W=lv.rows[0].length;
  const colorOf = k => ({azul:'#4c8dff',amarillo:'#ffd23f',rojo:'#ff5d73',blanco:'#ffffff'})[lv.palette[k]];
  const keys = Object.keys(lv.palette);
  const grid = lv.rows.map(()=>Array(W).fill('.'));
  let sel = keys[0], checks=0;
  const size = Math.min(64, Math.floor((Math.min(board.clientWidth||500, 520)-20)/W));
  const pix = h('div',{class:'pix',style:`grid-template-columns:repeat(${W},${size}px);grid-auto-rows:${size}px`});
  let painting=false;
  const paint = (x,y,btn)=>{ grid[y][x]=sel; btn.style.background=colorOf(sel); };
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const b=h('button',{'aria-label':`fila ${y+1} casilla ${x+1}`});
    b.addEventListener('pointerdown',e=>{ painting=true; paint(x,y,b); beep('tap'); try{b.releasePointerCapture(e.pointerId);}catch(_){} });
    b.addEventListener('pointerenter',()=>{ if(painting) paint(x,y,b); });
    pix.append(b);
  }
  const stopP=()=>painting=false; window.addEventListener('pointerup',stopP); cleanup.push(()=>window.removeEventListener('pointerup',stopP));
  const cols = h('div',{class:'colors'});
  keys.forEach(k=>{ const b=h('button',{class:k===sel?'sel':'',style:`background:${colorOf(k)}`,title:lv.palette[k],'aria-label':lv.palette[k],onclick:()=>{ sel=k; [...cols.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); beep('tap'); }}); cols.append(b); });
  // código por filas (codificación por longitud de series)
  const code = h('div',{class:'pixcode'});
  lv.rows.forEach((row,y)=>{
    const runs=[]; for(const ch of row){ if(runs.length && runs[runs.length-1][0]===ch) runs[runs.length-1][1]++; else runs.push([ch,1]); }
    code.append(h('div',{}, h('span',{class:'rn'},`F${y+1}`), runs.map(([ch,n])=>h('span',{class:'chip'}, String(n), h('span',{class:'sw',style:`background:${colorOf(ch)}`})))));
  });
  board.append(h('div',{class:'muted',style:'margin-bottom:.4em;font-weight:700'},'1) Elige color  2) Toca casillas'), cols, h('div',{style:'height:.8em'}), pix);
  side.append(h('b',{},'📜 Mensaje en código'), code,
    h('div',{class:'ctrl-row'},
      h('button',{class:'btn',onclick:()=>{ for(let y=0;y<H;y++) grid[y].fill('.'); [...pix.children].forEach(b=>b.style.background='#fff'); }},'🧽 Borrar'),
      h('button',{class:'btn primary',onclick:()=>{
        let wrong=0; const cells=[...pix.children];
        for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(grid[y][x]!==lv.rows[y][x]){ wrong++; cells[y*W+x].animate([{transform:'scale(1)'},{transform:'scale(.6)'},{transform:'scale(1)'}],{duration:500,iterations:2}); }
        checks++;
        if(!wrong) ctx.win(checks===1?3:checks<=3?2:1);
        else ctx.fail(`Hay ${wrong} casilla(s) que no coinciden con el código. ¡Mira las que se mueven!`);
      }},'✔ Comprobar')));
}

/* ================= clasificadora (condicionales) ================= */
function initSorter(ctx, board, side){
  const {lv} = ctx;
  const CONDS = [
    {id:'rojo', txt:'es de color rojo', f:it=>it[1]==='rojo'},
    {id:'azul', txt:'es de color azul', f:it=>it[1]==='azul'},
    {id:'tuerca', txt:'es una tuerca', f:it=>it[0]==='tuerca'},
    {id:'tornillo', txt:'es un tornillo', f:it=>it[0]==='tornillo'}
  ];
  const rule = {cond:null, then:null, els:null};
  let running=false, tries=0;
  const belt = h('div',{class:'belt'}, h('div',{class:'track'}));
  const boxes = lv.boxes.map((name,i)=>{ const b=h('div',{class:'box',style:i===0?'left:2%':'right:2%'}, h('div',{class:'bl'}, `Caja ${i+1}: ${name}`, h('span',{html:shapeSVG(i===0?'tuerca':'tornillo','morado',26)}))); belt.append(b); return b; });
  board.append(belt);
  const mkSel = (key, opts)=>{
    const row = h('div',{class:'row'});
    opts.forEach(o=>{ const b=h('button',{class:'sel-btn',onclick:()=>{ rule[key]=o.v; [...row.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); beep('tap'); }}, o.l); row.append(b); });
    return row;
  };
  side.append(h('div',{class:'rule'},
    h('div',{class:'row'}, h('span',{class:'kw'},'SI'), 'la pieza…'),
    mkSel('cond', CONDS.map(c=>({v:c.id,l:c.txt}))),
    h('div',{class:'row'}, h('span',{class:'kw'},'ENTONCES'), 'va a…'),
    mkSel('then', [{v:0,l:'Caja 1'},{v:1,l:'Caja 2'}]),
    h('div',{class:'row'}, h('span',{class:'kw'},'SI NO'), 'va a…'),
    mkSel('els', [{v:0,l:'Caja 1'},{v:1,l:'Caja 2'}])
  ), h('div',{class:'ctrl-row'}, h('button',{class:'btn primary',style:'font-size:1.2em',onclick:go},'▶ Encender cinta')));
  async function go(){
    if(running) return;
    if(rule.cond==null||rule.then==null||rule.els==null){ toast('Completa las tres partes de la regla.'); return; }
    running=true; tries++;
    boxes.forEach(b=>b.querySelectorAll('.mini').forEach(m=>m.remove()));
    const cond = CONDS.find(c=>c.id===rule.cond);
    let bad=0;
    const W = belt.clientWidth;
    for(const it of lv.items){
      const el = h('div',{class:'item',style:`left:${W/2-31}px;top:-70px`,html:shapeSVG(it[0],it[1],62)});
      belt.append(el); await sleep(30);
      el.style.top='44px'; await sleep(650);
      const dest = cond.f(it) ? rule.then : rule.els;
      el.style.left = (dest===0 ? W*.24-31 : W*.76-31)+'px'; await sleep(650);
      el.style.top='170px'; await sleep(500);
      el.remove();
      const ok = dest===lv.target(it);
      if(!ok) bad++;
      boxes[dest].append(h('span',{class:'mini',style:ok?'':'outline:3px solid var(--danger);border-radius:8px',html:shapeSVG(it[0],it[1],30)}));
      beep(ok?'step':'bad');
    }
    running=false;
    if(!bad) ctx.win(tries===1?3:tries<=3?2:1);
    else ctx.fail(`${bad} pieza(s) cayeron en la caja equivocada (marcadas en rojo). Cambia la regla.`);
  }
  side.append(h('div',{class:'muted'},'💬 Para comentar: ¿hay más de una regla que funcione?'));
}

/* ================= confeti ================= */
function confetti(){
  const cv=$('#confetti'), g=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#22d39a','#ff9f36','#a67cff','#ffd23f','#4c8dff','#ff5d73'];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,s:6+Math.random()*8,c:cols[Math.random()*6|0],r:Math.random()*6}));
  let f=0; (function tick(){ g.clearRect(0,0,cv.width,cv.height); for(const p of P){ p.x+=p.vx; p.y+=p.vy; p.vy+=.45; p.r+=.2; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore(); } if(++f<120) requestAnimationFrame(tick); else g.clearRect(0,0,cv.width,cv.height); })();
}

function startTimer(min){
  if(S.timer){ clearInterval(S.timer.id); S.timer.el.remove(); S.timer=null; }
  if(!min) return;
  const el = h('div',{class:'card timer'}); document.body.append(el);
  const end = Date.now()+min*60000;
  const tick = ()=>{ const s=Math.max(0,Math.round((end-Date.now())/1000)); el.textContent=`⏱️ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; if(s===0){ el.style.borderColor='var(--danger)'; el.style.color='var(--danger)'; beep('boss'); clearInterval(S.timer.id); } };
  S.timer = {el, id:setInterval(tick,1000)}; tick();
  el.onclick=()=>startTimer(0); el.title='Pulsa para quitar';
  toast(`Temporizador de ${min} min iniciado`, true);
}
