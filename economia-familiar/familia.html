<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi familia — Economía Familiar 2.0</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e07a3f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
</head>
<body>
  <header class="cabecera-app">
    <div class="contenedor">
      <span class="logo">💰</span>
      <h1 id="titulo-cabecera">Economía Familiar 2.0</h1>
      <a href="index.html" class="no-imprimir">Portada</a>
      <button id="btn-salir" class="btn btn-mini btn-secundario no-imprimir" style="display:none;">Salir</button>
    </div>
  </header>

  <main class="contenedor">

    <!-- ============ ENTRADA CON CÓDIGO ============ -->
    <section id="vista-login" class="vista">
      <div class="tarjeta destacada" style="max-width:460px; margin:40px auto;">
        <h2>👨‍👩‍👧‍👦 Entrada de la familia</h2>
        <p>Escribid el código de 6 letras que os ha dado vuestro profesor o profesora.</p>
        <form id="form-login">
          <div class="campo">
            <input id="campo-codigo" maxlength="6" autocomplete="off" autocapitalize="characters"
                   placeholder="Ejemplo: K7M2PQ" style="text-align:center; font-size:1.5rem; letter-spacing:6px; text-transform:uppercase;">
          </div>
          <p class="error-form" id="error-login"></p>
          <button class="btn btn-principal btn-grande" style="width:100%;" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <!-- ============ PANEL DE LA FAMILIA ============ -->
    <section id="vista-panel" class="vista">
      <div id="panel-familia-cabecera"></div>

      <div class="pestanas no-imprimir">
        <button class="pestana activa" data-vista="inicio">🏠 Nuestra casa</button>
        <button class="pestana" data-vista="historial">📈 Historial</button>
        <button class="pestana" data-vista="ranking">🏆 Ranking</button>
      </div>

      <div id="subvista-inicio" class="vista activa"></div>
      <div id="subvista-historial" class="vista"></div>
      <div id="subvista-ranking" class="vista"></div>
    </section>

    <!-- ============ MES EN JUEGO (PASOS) ============ -->
    <section id="vista-mes" class="vista">
      <div class="pasos-barra" id="barra-pasos"></div>
      <div id="contenido-paso"></div>
    </section>

  </main>

  <footer class="pie-app">Economía Familiar 2.0</footer>

  <script src="../js/firebase-config.js"></script>
  <script type="module" src="js/familia.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () { /* sin sw */ });
    }
  </script>
</body>
</html>
