<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyección — Cifras y Letras</title>
  <link rel="stylesheet" href="css/estilos.css">
  <meta name="theme-color" content="#131b3a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📽️</text></svg>">
</head>
<body>
  <main class="contenedor">

    <!-- elegir partida -->
    <section id="vista-codigo" class="vista activa">
      <div class="tarjeta destacada" style="max-width:420px; margin:60px auto; text-align:center;">
        <h2>📽️ Pantalla de proyección</h2>
        <p class="texto-suave">Escribe el código de la partida para proyectarla en la pizarra.</p>
        <form id="form-codigo">
          <div class="campo campo-codigo-grande">
            <input id="campo-codigo" maxlength="6" autocomplete="off" placeholder="ABC123" required>
          </div>
          <p class="error-form" id="error-codigo"></p>
          <button class="btn btn-principal btn-grande" style="width:100%;" type="submit">Proyectar</button>
        </form>
      </div>
    </section>

    <!-- proyección -->
    <section id="vista-proyeccion" class="vista">
      <div class="proyeccion-centro">
        <div id="zona-escena"></div>
        <div id="zona-marcador" style="max-width:640px; margin:20px auto;"></div>
        <p class="texto-suave"><a href="proyeccion.html" style="color:var(--texto-suave);">cambiar de partida</a></p>
      </div>
    </section>

  </main>

  <script src="../js/firebase-config.js"></script>
  <script type="module" src="js/proyeccion.js"></script>
</body>
</html>
